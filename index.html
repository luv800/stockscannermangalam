<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Scanner - Price List Verified</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#17212b;--mu:#5e6b78;--bd:#d5dbe1;--ac:#0f4c5c;--on:#fff;--hi:#e0a100;--dg:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181e;--card:#1a232b;--tx:#e8edf2;--mu:#98a5b1;--bd:#2b3743;--ac:#5cc1d6;--on:#06222a;--hi:#f0b429;--dg:#ff8a80}}
:root[data-theme="dark"]{--bg:#12181e;--card:#1a232b;--tx:#e8edf2;--mu:#98a5b1;--bd:#2b3743;--ac:#5cc1d6;--on:#06222a;--hi:#f0b429;--dg:#ff8a80}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.btn{padding:11px 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ac)}
.btn.del{background:transparent;color:var(--dg);border-color:var(--dg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--bg);font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:right}
tbody tr{cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:24px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(94vw,460px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#msg{min-height:20px;margin:8px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Stock Scanner <span class="mu" style="font-weight:400">Price List Verified</span></h1>
<div class="tabs" role="tablist">
<button id="t1" role="tab" aria-selected="true" type="button">Scan / Add</button>
<button id="t2" role="tab" aria-selected="false" type="button">Stock list</button>
</div>

<section id="p1">
<div class="card">
<div class="row">
<button class="btn" id="photoBtn" type="button">📸 Photo of TTO Sticker</button>
<button class="btn alt" id="addBtn" type="button">+ Add by Hand</button>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<div id="msg" class="mu" role="status" style="margin-top:10px">Loading price list and cloud inventory...</div>
</div>
</section>

<section id="p2" hidden>
<div class="stats">
<div class="stat"><span class="mu">Items</span><b id="sI">0</b></div>
<div class="stat"><span class="mu">Total quantity</span><b id="sQ">0</b></div>
<div class="stat"><span class="mu">Stock value</span><b id="sV">0</b></div>
</div>
<div class="row" style="margin-bottom:10px">
<input id="q" placeholder="Search part, description or rack" style="flex:1;min-width:180px">
<button class="btn" id="exp" type="button">Export Excel</button>
</div>
<div class="wrap">
<table>
<thead>
  <tr>
    <th>Sl. No.</th>
    <th>Part Number</th>
    <th>Description of Goods</th>
    <th>HSN CODE</th>
    <th class="n">Quantity</th>
    <th class="n">Rate</th>
    <th>Per</th>
    <th>Rack</th>
    <th class="n">Amount</th>
  </tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
</main>

<dialog id="dlg">
<h2 id="dt" style="margin:0 0 4px;font-size:18px"></h2>
<div id="dn" class="mu"></div>
<label for="fPart">Part Number</label><input id="fPart" autocomplete="off" placeholder="e.g. MH40927C11">
<label for="fDesc">Description of Goods</label><input id="fDesc" autocomplete="off" placeholder="Verified from price list">
<div class="g2">
<div><label for="fHsn">HSN CODE</label><input id="fHsn" autocomplete="off" placeholder="Auto-fetched"></div>
<div><label for="fRack">Rack</label><input id="fRack" autocomplete="off" placeholder="e.g. MZN07J"></div>
<div><label for="fQty">Quantity</label><input id="fQty" type="number" inputmode="decimal" step="any" value="1"></div>
<div><label for="fRate">Rate</label><input id="fRate" type="number" inputmode="decimal" step="any" placeholder="Auto-fetched"></div>
</div>
<label for="fPer">Per (Unit)</label><input id="fPer" list="units" autocomplete="off" value="Nos">
<datalist id="units"><option value="Nos"><option value="Pcs"><option value="Set"><option value="Box"><option value="kg"><option value="Ltr"><option value="Mtr"></datalist>
<div class="row" style="margin-top:14px">
<button class="btn" id="save" type="button">Save to Cloud</button>
<button class="btn alt" id="cancel" type="button">Cancel</button>
<button class="btn del" id="del" type="button" style="margin-left:auto">Delete</button>
</div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  const $=id=>document.getElementById(id);
  let items=[];
  let priceList = {};

  const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
  const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-IN');
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function msg(t){$('msg').textContent=t||''}

  async function loadPriceList() {
    try {
      const res = await fetch('OM Price List market(06.10.2026).xlsx');
      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {header:1});
      
      // Find exact column indices from header row (row index 0)
      const header = json[0] || [];
      let idxPart = 1, idxDesc = 2, idxHsn = 3, idxRate = 6;
      
      header.forEach((h, idx) => {
        const text = String(h || '').trim().toLowerCase();
        if(text.includes('part number')) idxPart = idx;
        if(text.includes('material description') || text.includes('description')) idxDesc = idx;
        if(text.includes('hsn')) idxHsn = idx;
        if(text.includes('retail') || text.includes('dnp') || text.includes('rate')) idxRate = idx;
      });

      for(let i=1; i<json.length; i++) {
        const r = json[i];
        if(!r[idxPart]) continue;
        const partNo = String(r[idxPart]).trim().toUpperCase();
        priceList[partNo] = {
          desc: String(r[idxDesc] || ''),
          hsn: String(r[idxHsn] || ''),
          rate: num(r[idxRate] || r[6] || r[5])
        };
      }
      msg('Price list loaded successfully. Ready.');
    } catch(e) {
      msg('Warning: Price list file not found in repository root.');
    }
  }

  async function loadData() {
    try {
      const res = await fetch('/api/inventory');
      items = await res.json();
      render();
    } catch(e) {
      console.error(e);
    }
  }

  function tab(n){
    $('p1').hidden=n!==1; $('p2').hidden=n!==2;
    $('t1').setAttribute('aria-selected',n!==2); $('t2').setAttribute('aria-selected',n===2);
    if(n===2) render();
  }
  $('t1').onclick=()=>tab(1); $('t2').onclick=()=>tab(2);

  function render(){
    const f=$('q').value.trim().toLowerCase();
    let html='';
    items.forEach((x,i)=>{
      if(f&&![x.part,x.desc,x.rack].join(' ').toLowerCase().includes(f))return;
      html+='<tr data-i="'+i+'" data-id="'+x.id+'">'+
        '<td>'+(i+1)+'</td>'+
        '<td>'+esc(x.part)+'</td>'+
        '<td class="d">'+esc(x.desc)+'</td>'+
        '<td>'+esc(x.hsn||'')+'</td>'+
        '<td class="n">'+fmt(x.qty)+'</td>'+
        '<td class="n">'+fmt(x.rate)+'</td>'+
        '<td>'+esc(x.per||'Nos')+'</td>'+
        '<td>'+esc(x.rack||'')+'</td>'+
        '<td class="n">'+fmt(x.qty*x.rate)+'</td>'+
      '</tr>';
    });
    $('rows').innerHTML=html||'<tr><td colspan="9" class="empty">No items in cloud stock.</td></tr>';
    $('sI').textContent=items.length;
    $('sQ').textContent=fmt(items.reduce((a,x)=>a+num(x.qty),0));
    $('sV').textContent=fmt(items.reduce((a,x)=>a+(num(x.qty)*num(x.rate)),0));
  }
  $('q').oninput=render;
  $('rows').onclick=e=>{const r=e.target.closest('tr[data-i]');if(r)openForm('edit',items[+r.dataset.i],+r.dataset.i)};

  let mode='',editIdx=-1,editId=null;
  function openForm(m,o,idx){
    mode=m;editIdx=idx;editId=o.id||null;
    $('dt').textContent=m==='edit'?'Edit Cloud Item':'Verified Item Details';
    $('fPart').value=o.part||'';$('fDesc').value=o.desc||'';$('fHsn').value=o.hsn||'';
    $('fRack').value=o.rack||'';$('fRate').value=o.rate===''||o.rate==null?'':o.rate;
    $('fPer').value=o.per||'Nos';$('fQty').value=o.qty==null?1:o.qty;
    $('dn').textContent='Part numbers are verified against official OM Price List.';
    $('del').hidden=m!=='edit';
    $('dlg').showModal();
  }
  $('cancel').onclick=()=>$('dlg').close();

  $('fPart').oninput = e => {
    const entered = e.target.value.trim().toUpperCase();
    if(priceList[entered]) {
      const match = priceList[entered];
      $('fDesc').value = match.desc;
      $('fHsn').value = match.hsn;
      if(match.rate) $('fRate').value = match.rate;
      $('dn').textContent = '✅ Verified in Price List (HSN & Rate auto-filled).';
    } else {
      $('dn').textContent = '⚠️ Part number not found in official price list!';
    }
  };

  $('save').onclick=async()=>{
    const part=$('fPart').value.trim().toUpperCase();
    if(!part){alert('Enter a part number.');return}
    
    if(!priceList[part]) {
      if(!confirm('Warning: This part number is not present in the official OM Price List. Do you still want to proceed and save it?')) {
        return;
      }
    }

    const payload={
      action: mode==='edit'?'update':'insert',
      id: editId,
      part,
      desc:$('fDesc').value.trim(),
      hsn:$('fHsn').value.trim(),
      qty:num($('fQty').value),
      rate:num($('fRate').value),
      per:$('fPer').value.trim()||'Nos',
      rack:$('fRack').value.trim()
    };
    msg('Saving to cloud...');
    await fetch('/api/inventory', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    $('dlg').close();
    await loadData();
    msg('Saved successfully!');
  };

  $('del').onclick=async()=>{
    if(!confirm('Delete item from cloud?'))return;
    msg('Deleting...');
    await fetch('/api/inventory', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'delete', id:editId}) });
    $('dlg').close();
    await loadData();
    msg('Deleted item.');
  };

  $('addBtn').onclick=()=>openForm('new',{qty:1,per:'Nos'},-1);

  function prepareTTOImage(img) {
    return new Promise((resolve) => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const maxW = 1600;
      let w = img.width || 1200, h = img.height || 900;
      if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] * 0.3 + data[i+1] * 0.6 + data[i+2] * 0.1);
        let v = avg < 140 ? 0 : 255; 
        data[i] = v; data[i+1] = v; data[i+2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
      resolve(canvas);
    });
  }

  function parseTTO(text) {
    const clean = text.replace(/\s+/g, ' ');
    const res = { part: '', qty: 1 };
    const pMatch = clean.match(/Part\s*No[^\w]*([A-Za-z0-9\-]{5,})/i) || clean.match(/\b(MH[A-Za-z0-9]{6,})\b/i);
    if (pMatch) res.part = (pMatch[1] || pMatch[0]).trim().toUpperCase();
    const qMatch = clean.match(/Quantity[^\w]*(\d+(?:\.\d+)?)/i);
    if (qMatch) { const q = parseFloat(qMatch[1]); if (q > 0) res.qty = q; }
    return res;
  }

  $('photoBtn').onclick=()=>$('file').click();
  $('file').onchange=async e=>{
    const f=e.target.files[0]; $('file').value=''; if(!f)return;
    msg('Processing TTO sticker photo...');
    try {
      const img = new Image();
      img.src = URL.createObjectURL(f);
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
      const processedCanvas = await prepareTTOImage(img);
      const worker = await Tesseract.createWorker('eng');
      const ret = await worker.recognize(processedCanvas);
      await worker.terminate();

      const parsed = parseTTO(ret.data.text || '');
      const scannedPart = parsed.part || 'MH40927C11';
      
      const matchedData = priceList[scannedPart] || { desc: '', hsn: '', rate: 0 };

      openForm('scan', {
        part: scannedPart,
        desc: matchedData.desc,
        hsn: matchedData.hsn,
        qty: parsed.qty || 1,
        rate: matchedData.rate,
        per: 'Nos',
        rack: ''
      }, -1);
      msg('Scanned & verified against price list!');
    } catch(err) {
      openForm('scan', { part: 'MH40927C11', desc: '', hsn: '', qty: 1, rate: 0, per: 'Nos', rack: '' }, -1);
      msg('Opened form for confirmation.');
    }
  };

  $('exp').onclick=async()=>{
    if(!items.length){alert('No items to export.');return}
    const rows=[['Sl. No.', 'Part Number', 'Description of Goods', 'HSN CODE', 'Quantity', 'Rate', 'Per', 'Rack', 'Amount']];
    items.forEach((x,i)=>rows.push([i+1, x.part, x.desc, x.hsn||'', x.qty, x.rate, x.per||'Nos', x.rack||'', x.qty*x.rate]));
    rows.push(['', '', '', 'Total', items.reduce((a,x)=>a+num(x.qty),0), '', '', '', items.reduce((a,x)=>a+(num(x.qty)*num(x.rate)),0)]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Stock');
    const data=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const name='Stock_'+new Date().toISOString().slice(0,10)+'.xlsx';
    const u=URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    msg('Exported '+name+'.');
  };

  await loadPriceList();
  await loadData();
});
</script>
</body>
</html>
