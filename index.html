<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Scanner</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#17212b;--mu:#5e6b78;--bd:#d5dbe1;--ac:#0f4c5c;--on:#fff;--hi:#e0a100;--dg:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181e;--card:#1a232b;--tx:#e8edf2;--mu:#98a5b1;--bd:#2b3743;--ac:#5cc1d6;--on:#06222a;--hi:#f0b429;--dg:#ff8a80}}
:root[data-theme="dark"]{--bg:#12181e;--card:#1a232b;--tx:#e8edf2;--mu:#98a5b1;--bd:#2b3743;--ac:#5cc1d6;--on:#06222a;--hi:#f0b429;--dg:#ff8a80}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.btn{padding:11px 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ac)}
.btn.del{background:transparent;color:var(--dg);border-color:var(--dg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:14px}
#camwrap{position:relative;margin-top:12px;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3}
#camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:18% 18%;border:3px solid var(--hi);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--bg);font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:right}
tbody tr{cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:24px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(94vw,460px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#msg{min-height:20px;margin:8px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Stock Scanner</h1>
<div class="tabs" role="tablist">
<button id="t1" role="tab" aria-selected="true" type="button">Scan</button>
<button id="t2" role="tab" aria-selected="false" type="button">Stock list</button>
</div>
 
<section id="p1">
<div class="card">
<div class="row">
<button class="btn" id="camBtn" type="button">Start camera</button>
<button class="btn alt" id="photoBtn" type="button">Upload photo to scan</button>
<button class="btn alt" id="addBtn" type="button">Add item by hand</button>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="msg" class="mu" role="status">Ready. Hold the phone close so the whole label is in view.</div>
<div id="camwrap" hidden><video id="vid" playsinline muted></video><div class="frame"></div></div>
</div>
</section>
 
<section id="p2" hidden>
<div class="stats">
<div class="stat"><span class="mu">Items</span><b id="sI">0</b></div>
<div class="stat"><span class="mu">Total quantity</span><b id="sQ">0</b></div>
<div class="stat"><span class="mu">Stock value</span><b id="sV">0</b></div>
</div>
<div class="row" style="margin-bottom:10px">
<input id="q" placeholder="Search part, description or rack" style="flex:1;min-width:180px">
<button class="btn" id="exp" type="button">Export Excel</button>
<button class="btn alt" id="impBtn" type="button">Import Excel</button>
<input type="file" id="impFile" accept=".xlsx, .xls" hidden>
</div>
<div class="wrap">
<table>
<thead><tr><th>Sl. No.</th><th>Part Number</th><th>Description of Goods</th><th>HSN Code</th><th class="n">Quantity</th><th class="n">Rate</th><th>Per</th><th class="n">Amount</th><th>Rack</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
</main>
 
<dialog id="dlg">
<h2 id="dt" style="margin:0 0 4px;font-size:18px"></h2>
<div id="dn" class="mu"></div>
<label for="fPart">Part Number</label><input id="fPart" autocomplete="off">
<label for="fDesc">Description of Goods</label><input id="fDesc" autocomplete="off">
<div class="g2">
<div><label for="fHsn">HSN Code</label><input id="fHsn" inputmode="numeric" autocomplete="off"></div>
<div><label for="fRack">Rack</label><input id="fRack" autocomplete="off"></div>
<div><label for="fQty" id="lQty">Quantity</label><input id="fQty" type="number" inputmode="decimal" step="any"></div>
<div><label for="fRate">Rate</label><input id="fRate" type="number" inputmode="decimal" step="any"></div>
</div>
<label for="fPer">Per</label><input id="fPer" list="units" autocomplete="off">
<datalist id="units"><option value="Nos"><option value="Pcs"><option value="Set"><option value="Box"><option value="kg"><option value="Ltr"><option value="Mtr"></datalist>
<div class="row" style="margin-top:14px">
<button class="btn" id="save" type="button">Save</button>
<button class="btn alt" id="cancel" type="button">Cancel</button>
<button class="btn del" id="del" type="button" style="margin-left:auto">Delete</button>
</div>
</dialog>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const $=id=>document.getElementById(id);
  const KEY='stock-scanner-items';
  let items=[];
  try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[]}catch(e){items=[]}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
  const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
  const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-IN');
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function msg(t){$('msg').textContent=t||''};
 
  function tab(n){
    $('p1').hidden=n!==1;$('p2').hidden=n!==2;
    $('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2);
    if(n!==1)stopCam();
    if(n===2)render();
  }
  $('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
 
  function render(){
    const f=$('q').value.trim().toLowerCase();
    let html='';
    items.forEach((x,i)=>{
      if(f&&![x.part,x.desc,x.rack].join(' ').toLowerCase().includes(f))return;
      html+='<tr data-i="'+i+'"><td>'+(i+1)+'</td><td>'+esc(x.part)+'</td><td class="d">'+esc(x.desc)+'</td><td>'+esc(x.hsn)+'</td><td class="n">'+fmt(x.qty)+'</td><td class="n">'+fmt(x.rate)+'</td><td>'+esc(x.per)+'</td><td class="n">'+fmt(x.qty*x.rate)+'</td><td>'+esc(x.rack)+'</td></tr>';
    });
    $('rows').innerHTML=html||'<tr><td colspan="9" class="empty">'+(items.length?'No item matches your search.':'No items yet. Scan a QR code or add an item by hand.')+'</td></tr>';
    $('sI').textContent=items.length;
    $('sQ').textContent=fmt(items.reduce((a,x)=>a+x.qty,0));
    $('sV').textContent=fmt(items.reduce((a,x)=>a+x.qty*x.rate,0));
  }
  $('q').oninput=render;
  $('rows').onclick=e=>{const r=e.target.closest('tr[data-i]');if(r)openForm('edit',items[+r.dataset.i],+r.dataset.i)};
 
  let mode='',editIdx=-1;
  function openForm(m,o,idx){
    mode=m;editIdx=idx;
    $('dt').textContent=m==='edit'?'Edit item':m==='scan'?'Scanned item':'New item';
    $('fPart').value=o.part||'';$('fDesc').value=o.desc||'';$('fHsn').value=o.hsn||'';
    $('fRack').value=o.rack||'';$('fRate').value=o.rate===''||o.rate==null?'':o.rate;
    $('fPer').value=o.per||'Nos';$('fQty').value=o.qty==null?1:o.qty;
    const ex=m==='scan'?items.find(x=>x.part.toLowerCase()===(o.part||'').toLowerCase()):null;
    $('lQty').textContent=ex?'Quantity to add':'Quantity';
    $('dn').textContent=ex?'Already in your list with quantity '+fmt(ex.qty)+'. The quantity below will be added.':'';
    $('del').hidden=m!=='edit';
    $('dlg').showModal();
  }
  $('cancel').onclick=()=>$('dlg').close();
  $('save').onclick=()=>{
    const part=$('fPart').value.trim();
    if(!part){$('dn').textContent='Enter a part number to save this item.';return}
    const o={part,desc:$('fDesc').value.trim(),hsn:$('fHsn').value.trim(),qty:num($('fQty').value),rate:num($('fRate').value),per:$('fPer').value.trim()||'Nos',rack:$('fRack').value.trim()};
    if(mode==='edit'){items[editIdx]=o}
    else{
      const ex=items.find(x=>x.part.toLowerCase()===part.toLowerCase());
      if(ex){ex.qty+=o.qty;for(const k of['desc','hsn','per','rack'])if(o[k])ex[k]=o[k];if(o.rate)ex.rate=o.rate}
      else items.push(o);
    }
    persist();render();msg('Saved '+part+'.');$('dlg').close();
  };
  $('del').onclick=()=>{
    if(!confirm('Delete '+items[editIdx].part+' from the stock list?'))return;
    items.splice(editIdx,1);persist();render();$('dlg').close();
  };
  $('addBtn').onclick=()=>{stopCam();openForm('new',{qty:1,per:'Nos'},-1)};
 
  // QR on OM labels reads like: 1.000/4943888379/0007/066  (qty / number / number / code)
  function parseQR(t){
    t=t.trim();
    const o={part:'',desc:'',hsn:'',rate:'',per:'Nos',rack:'',qty:1,box:''};
    const p=t.split('/').map(s=>s.trim());
    if(p.length>=3&&/^\d+(\.\d+)?$/.test(p[0])){o.qty=num(p[0])||1;o.per='Pcs';o.box=p[1]+p[2];return o}
    if(t.includes('|')){
      const q=t.split('|').map(s=>s.trim());
      o.part=q[0]||'';o.desc=q[1]||'';o.hsn=q[2]||'';o.rate=q[3]||'';o.per=q[4]||'Nos';o.rack=q[5]||'';
      return o;
    }
    o.part=t;return o;
  }
 
  // Printed label text -> fields: top line = Description of Goods, Mat. = Part Number, Bin = Rack
  function parseLabel(t){
    const o={};
    const L=t.split(/\n/).map(s=>s.replace(/¢/g,'C').trim()).filter(Boolean);
    for(const l of L){
      if(!o.desc){
        const m=l.match(/([A-Z][A-Za-z ]{3,}?)\s*[-~–—]\s*(\d{6,})/);
        if(m)o.desc=m[1].trim().replace(/^(\S{1,2}\s+)+/,'').toUpperCase()+' - '+m[2];
      }
      if(!o.part){const m=l.match(/\bMat\b\.?\s*[:\-]?\s*([A-Za-z0-9]{6,})/i);if(m)o.part=m[1].toUpperCase()}
      if(!o.rack){const m=l.match(/\bBin\b\.?\s*[:\-]?\s*([A-Za-z0-9]{4,})/i);if(m)o.rack=m[1].toUpperCase()}
      if(!o.qty){const m=l.match(/\bQty\b\.?\s*[:\-]?\s*(\d+)\s*[.,]\s*0{3}/i);if(m)o.qty=num(m[1])}
    }
    return o;
  }
 
  // Crop the label area around the QR code (text sits to the left of it) for OCR
  function cropLabel(src,w,h,b){
    const q=Math.max(b.x1-b.x0,b.y1-b.y0);
    const cx0=Math.max(0,b.x0-4.4*q),cx1=Math.min(w,b.x1+0.15*q);
    const cy0=Math.max(0,b.y0-0.8*q),cy1=Math.min(h,b.y1+0.45*q);
    const cw=cx1-cx0,ch=cy1-cy0;
    const s=Math.max(1,Math.min(3,1800/cw));
    const c=document.createElement('canvas');c.width=Math.round(cw*s);c.height=Math.round(ch*s);
    const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';
    x.drawImage(src,cx0,cy0,cw,ch,0,0,c.width,c.height);
    return c;
  }
  let wk=null;
  async function ocr(canvas){
    if(!window.Tesseract)return '';
    try{
      if(!wk)wk=Tesseract.createWorker('eng').then(async w=>{await w.setParameters({tessedit_pageseg_mode:'4'});return w});
      const w=await wk;const r=await w.recognize(canvas);return r.data.text||'';
    }catch(e){wk=null;return ''}
  }
 
  async function got(res,crop){
    if(navigator.vibrate)navigator.vibrate(80);
    stopCam();
    const o=parseQR(res.text);
    let read=false;
    if(crop){
      msg('QR read. Reading the label text (the first time takes a few seconds)...');
      const lab=parseLabel(await ocr(crop));
      if(lab.part||lab.desc||lab.rack){read=true;o.part=lab.part||o.part;o.desc=lab.desc||o.desc;o.rack=lab.rack||o.rack}
    }
    const ex=items.find(x=>x.part&&x.part.toLowerCase()===o.part.toLowerCase());
    if(ex){for(const k of['desc','hsn','rack'])if(!o[k])o[k]=ex[k];if(!o.rate)o.rate=ex.rate;o.per=ex.per}
    msg('');
    openForm('scan',o,-1);
    if(!ex){
      if(read)$('dn').textContent='Read from the label. Check Part Number, Description and Rack, then add HSN Code and Rate.';
      else if(o.box)$('dn').textContent='Label text could not be read. Number from QR: '+o.box+'. Type the Part Number from the label.';
    }
  }
 
  const det='BarcodeDetector' in window?new BarcodeDetector():null;
  const cv=document.createElement('canvas');
  // returns {text, box:{x0,x1,y0,y1}} in the source's own pixels, or null
  async function decode(src,w,h){
    if(det){
      try{
        const r=await det.detect(src);
        if(r.length){const b=r[0].boundingBox;return {text:r[0].rawValue,box:{x0:b.x,x1:b.x+b.width,y0:b.y,y1:b.y+b.height}}}
      }catch(e){}
    }
    if(window.jsQR){
      for(const mw of [2000,1400,900]){
        const s=Math.min(1,mw/w);cv.width=Math.round(w*s);cv.height=Math.round(h*s);
        const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,cv.width,cv.height);
        const d=x.getImageData(0,0,cv.width,cv.height);
        const q=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
        if(q){
          const c=q.location,xs=[c.topLeftCorner.x,c.topRightCorner.x,c.bottomLeftCorner.x,c.bottomRightCorner.x],ys=[c.topLeftCorner.y,c.topRightCorner.y,c.bottomLeftCorner.y,c.bottomRightCorner.y];
          return {text:q.data,box:{x0:Math.min(...xs)/s,x1:Math.max(...xs)/s,y0:Math.min(...ys)/s,y1:Math.max(...ys)/s}};
        }
        if(s===1)break;
      }
    }
    return null;
  }
 
  let stream=null,busy=false,raf=0,last=0;
  async function startCam(){
    if(stream)return;
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
      $('vid').srcObject=stream;await $('vid').play();
      $('camwrap').hidden=false;$('camBtn').textContent='Stop camera';msg('Hold the phone close so the whole label is in view, and keep it steady.');tick();
    }catch(e){
      stream=null;msg('Camera unavailable ('+((e&&e.name)||'error')+'). Use "Upload photo to scan".');
    }
  }
  function stopCam(){
    cancelAnimationFrame(raf);
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=null;$('camwrap').hidden=true;$('camBtn').textContent='Start camera';
  }
  async function tick(){
    if(!stream)return;
    const v=$('vid'),n=Date.now();
    if(!busy&&n-last>200&&v.videoWidth){
      busy=true;last=n;
      const r=await decode(v,v.videoWidth,v.videoHeight);
      busy=false;
      if(r&&stream){const c=cropLabel(v,v.videoWidth,v.videoHeight,r.box);got(r,c);return}
    }
    raf=requestAnimationFrame(tick);
  }
  $('camBtn').onclick=()=>stream?stopCam():startCam();
  $('photoBtn').onclick=()=>$('file').click();
  $('file').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    msg('Reading photo...');
    try{
      const b=await createImageBitmap(f);
      const r=await decode(b,b.width,b.height);
      if(r){got(r,cropLabel(b,b.width,b.height,r.box))}
      else msg('No QR code found. Move closer so the label fills the photo, keep it sharp and avoid glare.');
    }catch(err){msg('That image could not be read.')}
  };
 
  // Export Excel
  $('exp').onclick=async()=>{
    if(!items.length){alert('Add at least one item before exporting.');return}
    const rows=[['Sl. No.','Part Number','Description of Goods','HSN Code','Quantity','Rate','Per','Amount','Rack']];
    items.forEach((x,i)=>rows.push([i+1,x.part,x.desc,x.hsn,x.qty,x.rate,x.per,x.qty*x.rate,x.rack]));
    rows.push(['','','','Total',items.reduce((a,x)=>a+x.qty,0),'','',items.reduce((a,x)=>a+x.qty*x.rate,0),'']);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Stock');
    const data=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const name='Stock_'+new Date().toISOString().slice(0,10)+'.xlsx';
    const u=URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    msg('Exported '+name+'.');
  };
 
  // Import Excel (Syncs phone and laptop instantly)
  $('impBtn').onclick=()=>$('impFile').click();
  $('impFile').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{
      const data=await f.arrayBuffer();
      const wb=XLSX.read(data);
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{header:1});
      const newItems=[];
      for(let i=1; i<json.length; i++){
        const r=json[i];
        if(!r[1] || r[1]==='Total') continue;
        newItems.push({
          part: String(r[1]||''),
          desc: String(r[2]||''),
          hsn: String(r[3]||''),
          qty: num(r[4]),
          rate: num(r[5]),
          per: String(r[6]||'Nos'),
          rack: String(r[8]||'')
        });
      }
      if(newItems.length){
        items=newItems;
        persist();
        render();
        msg('Successfully imported '+items.length+' items!');
      }else{
        alert('No valid items found in this Excel file.');
      }
    }catch(err){
      alert('Could not parse the Excel file.');
    }
  };
 
  render();
});
</script>
</body>
</html>
